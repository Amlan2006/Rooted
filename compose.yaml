services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rooted
      POSTGRES_USER: rooted
      POSTGRES_PASSWORD: ${ROOTED_DB_PASSWORD:-rooted-local-only}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - rooted_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rooted -d rooted"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  rooted_postgres:
